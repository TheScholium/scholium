<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scholium Plot</title>
<meta name="description" content="Scholium Plot: a Supernote plugin that draws graphs, slope fields, polar curves and class diagrams onto your page in real ink. Try it in your browser.">
<style>
  :root { --ink: #111; --paper: #fbfbf8; }
  body { margin: 0; background: #e9e7e1; font-family: Georgia, 'Times New Roman', serif; color: var(--ink); }
  .wrap { display: flex; gap: 32px; padding: 28px; align-items: flex-start; flex-wrap: wrap; }
  .device { position: relative; padding: 26px 22px 30px; background: #2a2a2a; border-radius: 22px; box-shadow: 0 18px 40px rgba(0,0,0,.25); }
  .plugin { position: absolute; left: 22px; top: 26px; width: 702px; height: 936px; background: #fff; overflow: hidden; }
  #rn { width: 702px; height: 936px; display: flex; overflow: hidden; }
  #rn > div { flex: 1; min-width: 0; }
  .side { max-width: 340px; }
  .side h1 { font-weight: 400; font-size: 34px; margin: 6px 0 10px; }
  .side button { display: block; width: 100%; margin: 10px 0; padding: 12px 14px; font: inherit; font-size: 16px; background: #fff; border: 1.5px solid var(--ink); cursor: pointer; text-align: left; }
  .side button:hover { background: var(--ink); color: #fff; }
  .side a { color: var(--ink); }
  .small { font-size: 14px; color: #555; font-style: italic; }
  @media (max-width: 800px) { .device { transform: scale(.5); transform-origin: top left; } }
</style></head>
<body><div id="root"></div><script src="sim.js"></script></body></html>
